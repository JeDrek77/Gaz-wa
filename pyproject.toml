[project]
name = "gaz-wa"
version = "0.1.0"
description = "Pipeline do eksploracji i prognozowania zuzycia gazu w elektrocieplowni."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "holidays>=0.55",
    "matplotlib>=3.9.0",
    "numpy>=2.0.0",
    "openpyxl>=3.1.5",
    "pandas>=2.2.2",
    "plotly>=5.23.0",
    "pydantic>=2.8.2",
    "pyarrow>=17.0.0",
    "python-dotenv>=1.0.1",
    "scikit-learn>=1.5.1",
    "seaborn>=0.13.2",
    "typer>=0.12.3",
]

[project.optional-dependencies]
dev = [
    "ipykernel>=6.29.5",
    "jupyterlab>=4.2.4",
    "pytest>=8.3.2",
    "ruff>=0.6.2",
]
models = [
    "lightgbm>=4.5.0",
    "xgboost>=2.1.1",
]

[project.scripts]
gaz-wa = "gaz_wa.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gaz_wa"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
